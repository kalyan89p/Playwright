<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Index Page</title>

  <style>
  body {
    margin: 0;
    height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;
  }

  #container {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }

  img {
    width: 250px;
    height: 250px;
    border: 1px solid black;
  }

  #openButton {
    padding: 10px 20px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div id="container">

    <img
      id="mainImage"
      src="RAVANA.jpg"
      alt="Main Image"
    >

    <img
      id="gifImage"
      src="GONE.gif"
      alt="Gif Image"
    >

  </div>

  <button id="openButton">
    Nenu Pothanu Annayya, Nenu Pothanu
  </button>

  <script>
    document
      .getElementById("openButton")
      .addEventListener("click", function () {

        const result = confirm(
          "GO DIE!"
        );

        if (result) {
          window.open("second.html", "_blank");
        }
      });
  </script>

</body>
</html>
